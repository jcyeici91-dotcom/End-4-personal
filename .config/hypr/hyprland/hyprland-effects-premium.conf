# =========================================================
# Hyprland Effects Premium V2 Ultra Final (Compatible)
# =========================================================

decoration {
    rounding = 16

    active_opacity = 1.0
    inactive_opacity = 0.96
    fullscreen_opacity = 1.0

    dim_inactive = false
    dim_strength = 0.04

    drop_shadow = true
    shadow_range = 22
    shadow_render_power = 3
    shadow_ignore_window = true
    shadow_scale = 1.0

    col.shadow = rgba(000000cc)
    col.shadow_inactive = rgba(00000088)

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = false
        xray = false
        noise = 0.015
        contrast = 1.08
        brightness = 1.0
        vibrancy = 0.18
        vibrancy_darkness = 0.15

        popups = true
        popups_ignorealpha = 0.2

        special = false
    }
}

general {
    gaps_in = 6
    gaps_out = 10
    border_size = 2

    resize_on_border = true
    allow_tearing = false
    layout = dwindle

    col.active_border = rgba(7aa2f7ff) rgba(bb9af7ff) 45deg
    col.inactive_border = rgba(3b4261cc)
}

animations {
    enabled = true

    bezier = ultraOut, 0.16, 1, 0.3, 1
    bezier = ultraSmooth, 0.25, 1, 0.5, 1
    bezier = softInOut, 0.42, 0, 0.2, 1

    animation = windows, 1, 5, ultraOut, popin 82%
    animation = windowsIn, 1, 5, ultraOut, popin 82%
    animation = windowsOut, 1, 4, softInOut, popin 86%
    animation = border, 1, 8, ultraSmooth
    animation = borderangle, 1, 8, ultraSmooth
    animation = fade, 1, 5, ultraSmooth
    animation = workspaces, 1, 5, ultraOut, slide
    animation = layers, 1, 5, ultraSmooth
    animation = specialWorkspace, 1, 6, ultraOut, slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
    vrr = 1
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

input {
    follow_mouse = 1
    float_switch_override_focus = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
        disable_while_typing = true
        clickfinger_behavior = true
        tap-to-click = true
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_invert = false
    workspace_swipe_min_speed_to_force = 30
    workspace_swipe_cancel_ratio = 0.15
    workspace_swipe_create_new = false
}

xwayland {
    force_zero_scaling = true
}
