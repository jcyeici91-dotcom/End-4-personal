# ==============================================================================
# 🥭 MANGOWC STYLE - ULTIMATE MASTER EDITION (refinado)
# ==============================================================================

$p1 = rgba(33ccffee)
$p2 = rgba(00ff99ee)
$p3 = rgba(d980faee)
$inactive = rgba(595959aa)

general {
  layout = master
  border_size = 1

  col.active_border = $p1 $p2 $p3 45deg
  col.inactive_border = $inactive

  gaps_in = 4
  gaps_out = 8

  allow_tearing = false
  resize_on_border = true
}

master {
  new_status = master
  new_on_top = true
  mfact = 0.55
  orientation = left
  allow_small_split = true
}

decoration {
  rounding = 12

  dim_inactive = true
  dim_strength = 0.1

  # Opacidad global (RECOMENDADO si tu Hyprland lo soporta)
  # Si te da "unknown keyword", comenta estas 3 líneas y usa windowrulev2 abajo.
  active_opacity = 0.95
  inactive_opacity = 0.85
  fullscreen_opacity = 1.0

  shadow {
    enabled = true
    range = 24
    render_power = 3

    # Sombra con un leve tinte "cyber" (glow sutil)
    # (si lo quieres más discreto: baja alpha al final)
    color = rgba(00ff9955)

    # Si tu build NO soporta scale, comenta la siguiente línea:
    # scale = 0.98
  }

  blur {
    enabled = true
    size = 6
    passes = 3
    ignore_opacity = true
    new_optimizations = true
    xray = false

    noise = 0.02
    contrast = 1.05
    brightness = 0.95
    vibrancy = 0.18
  }
}

animations {
  enabled = true

  bezier = fluid, 0.05, 0.9, 0.1, 1.05
  bezier = bounce, 0.175, 0.885, 0.32, 1.275
  bezier = smooth, 0.25, 0.1, 0.25, 1.0

  animation = windows, 1, 5, bounce, popin 80%
  animation = windowsOut, 1, 5, fluid, popin 80%
  animation = windowsMove, 1, 6, fluid

  animation = fade, 1, 4, smooth
  animation = workspaces, 1, 6, fluid, slidefade 20%

  animation = border, 1, 10, default
  animation = borderangle, 1, 120, smooth, loop
}


