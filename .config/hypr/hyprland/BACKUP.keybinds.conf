# =========================================================================
# 3. APLICACIONES Y LANZADORES (Apps & Launchers)
# =========================================================================
# -- Aplicaciones Comunes --
bind = Super, T, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh  "${TERMINAL}" "kitty -1" "foot" "alacritty" "wezterm" "konsole" "kgx" "uxterm" "xterm" # Terminal (Alt)

bind = Super, E, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "dolphin" "nautilus" "nemo" "thunar" "${TERMINAL}" "kitty -1 fish -c yazi" # Gestor de Archivos

bind = Super, W, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "google-chrome-stable" "zen-browser" "firefox" "brave" "chromium" "microsoft-edge-stable" "opera" "librewolf" # Navegador Web

#bind = Ctrl+Super, V, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "pavucontrol-qt" "pavucontrol" # Mezclador de Volumen

# -- TUS ATAJOS PERSONALIZADOS (Flatpaks y más) --
bind = Super+ALT, Y, exec, flatpak run com.github.th_ch.youtube_music  # YouTube Music (Super + Alt + Y)
bind = Super+ALT, T, exec, flatpak run org.telegram.desktop            # Telegram (Super + Alt + T)
bind = Super+ALT, E, exec, gedit                                       # Gedit (Super + Alt + E)
# Discord (D)
bind = SUPER ALT, d, exec, discord
# OBS Studio (O)
bind = SUPER ALT, o, exec, obs
# Usar 'timeshift-launcher' 
bind = SUPER ALT, b, exec, timeshift-launcher

# --- Multimedia ---

# VLC Media Player (V)
bind = SUPER ALT, v, exec, vlc


# -- Utilidades de Sistema (Session) --
bindd = Super, L, Lock, exec, loginctl lock-session                    # Bloquear Pantalla (Super + L)
bindld = Super+Shift, L, Suspend system, exec, systemctl suspend || loginctl suspend # Suspender (Super + Shift + L)

# -- Máquinas Virtuales (Submap) --
bind = Super+Alt, F1, exec, notify-send 'Entered Virtual Machine submap' 'Keybinds disabled. Hit Super+Alt+F1 to escape' -a 'Hyprland' && hyprctl dispatch submap virtual-machine
submap = virtual-machine
bind = Super+Alt, F1, exec, notify-send 'Exited Virtual Machine submap' 'Keybinds re-enabled' -a 'Hyprland' && hyprctl dispatch submap global
submap = global

bind = Super, B, exec, flatpak run com.brave.Browser
# =========================================================================
# 4. MULTIMEDIA Y HARDWARE (Audio, Brillo, Play/Pause)
# =========================================================================
# -- Audio (Botones dedicados) --
bindle=, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+ -l 1.5   # Subir Volumen
bindle=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-          # Bajar Volumen
bindl = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_SINK@ toggle                      # Silenciar Audio
bindld = Super+Shift,M, Toggle mute, exec, wpctl set-mute @DEFAULT_SINK@ toggle         # [hidden]
bindl = Alt ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle                # Silenciar Micrófono
bindl = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle                 # Silenciar Micrófono (tecla dedicada)
bindld = Super+Alt,M, Toggle mic, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle          # [hidden]

# -- Brillo (Botones dedicados) --
bindle=, XF86MonBrightnessUp, exec, qs -c $qsConfig ipc call brightness increment || brightnessctl s 5%+ # Subir Brillo
bindle=, XF86MonBrightnessDown, exec, qs -c $qsConfig ipc call brightness decrement || brightnessctl s 5%- # Bajar Brillo

# -- Control de Reproducción (Playerctl) --
bindl= Super+Shift, P, exec, playerctl play-pause  # Play/Pause (Super+Shift+P)
bindl= Super+Shift, N, exec, playerctl next || playerctl position `bc <<< "100 * $(playerctl metadata mpris:length) / 1000000 / 100"` # Siguiente
bindl= Super+Shift, B, exec, playerctl previous    # Anterior
bindl= ,XF86AudioPlay, exec, playerctl play-pause  # [hidden]
bindl= ,XF86AudioPause, exec, playerctl play-pause # [hidden]
bindl= ,XF86AudioNext, exec, playerctl next || playerctl position `bc <<< "100 * $(playerctl metadata mpris:length) / 1000000 / 100"` # [hidden]
bindl= ,XF86AudioPrev, exec, playerctl previous    # [hidden]
bind = Super+Shift+Alt, mouse:275, exec, playerctl previous # [hidden]
bind = Super+Shift+Alt, mouse:276, exec, playerctl next || playerctl position `bc <<< "100 * $(playerctl metadata mpris:length) / 1000000 / 100"` # [hidden]


# =========================================================================
# 5. HERRAMIENTAS (Capturas, Zoom, OCR)
# =========================================================================
# -- Captura de Pantalla (Screenshot) --
bindl = ,Print,exec,grim - | wl-copy  # Tecla "Impr Pant" -> Pantalla completa al portapapeles
bindln = Ctrl,Print, exec, mkdir -p $(xdg-user-dir PICTURES)/Screenshots && grim $(xdg-user-dir PICTURES)/Screenshots/Screenshot_"$(date '+%Y-%m-%d_%H.%M.%S')".png # Pantalla completa a archivo
bindln = Ctrl,Print,exec,grim - | wl-copy # [hidden]
bind = Super+Shift, S, global, quickshell:regionScreenshot # Recorte de pantalla (Quickshell)
bind = Super+Shift, S, exec, qs -c $qsConfig ipc call TEST_ALIVE || pidof slurp || hyprshot --freeze --clipboard-only --mode region --silent # Recorte (Fallback)

# -- Grabación de Pantalla (Recording) --
bindl = Super+Shift, R, global, quickshell:regionRecord # Grabar región (sin audio)
bindl = Super+Shift, R, exec, qs -c $qsConfig ipc call TEST_ALIVE || ~/.config/quickshell/$qsConfig/scripts/videos/record.sh # Fallback
bindl = Super+Alt, R, global, quickshell:regionRecord # [hidden]
bindl = Super+Alt, R, exec, qs -c $qsConfig ipc call TEST_ALIVE || ~/.config/quickshell/$qsConfig/scripts/videos/record.sh # Fallback
bindl = Ctrl+Alt, R, exec, ~/.config/quickshell/$qsConfig/scripts/videos/record.sh --fullscreen # Grabar pantalla completa
bindl = Super+Shift+Alt, R, exec, ~/.config/quickshell/$qsConfig/scripts/videos/record.sh --fullscreen --sound # Grabar pantalla con sonido

# -- OCR (Copiar texto de imagen) --
bind = Super+Shift, X, global, quickshell:regionOcr # OCR al portapapeles
bind = Super+Shift, T, global, quickshell:regionOcr # [hidden]
# Fallback OCR:
bind = Super+Shift, X,exec, qs -c $qsConfig ipc call TEST_ALIVE || pidof slurp || grim -g "$(slurp $SLURP_ARGS)" "/tmp/ocr_image.png" && tesseract "/tmp/ocr_image.png" stdout -l $(tesseract --list-langs | awk 'NR>1{print $1}' | tr '\\n' '+' | sed 's/\\+$/\\n/') | wl-copy && rm "/tmp/ocr_image.png"
bind = Super+Shift, T,exec, qs -c $qsConfig ipc call TEST_ALIVE || pidof slurp || grim -g "$(slurp $SLURP_ARGS)" "/tmp/ocr_image.png" && tesseract "/tmp/ocr_image.png" stdout -l $(tesseract --list-langs | awk 'NR>1{print $1}' | tr '\\n' '+' | sed 's/\\+$/\\n/') | wl-copy && rm "/tmp/ocr_image.png"

bindd = Super+Shift, C, Color picker, exec, hyprpicker -a # Selector de Color (Hex)

# -- Google Lens Search (Buscar imagen en Google) --
bind = Super+Shift, A, global, quickshell:regionSearch
bind = Super+Shift, A, exec, qs -c $qsConfig ipc call TEST_ALIVE || pidof slurp || ~/.config/hypr/hyprland/scripts/snip_to_search.sh # Fallback

# -- Zoom (Accessibilidad / Lupa) --
binde = Super, Minus, exec, qs -c $qsConfig ipc call zoom zoomOut # Zoom Menos (Super + Menos)
binde = Super, Equal, exec, qs -c $qsConfig ipc call zoom zoomIn  # Zoom Más (Super + Igual)
binde = Super, Minus, exec, qs -c $qsConfig ipc call TEST_ALIVE || ~/.config/hypr/hyprland/scripts/zoom.sh decrease 0.1 # Fallback
binde = Super, Equal, exec, qs -c $qsConfig ipc call TEST_ALIVE || ~/.config/hypr/hyprland/scripts/zoom.sh increase 0.1 # Fallback
# Zoom con Keypad
binde = Super, code:82, exec, qs -c $qsConfig ipc call zoom zoomOut
binde = Super, code:86, exec, qs -c $qsConfig ipc call zoom zoomIn
binde = Super, code:82, exec, qs -c $qsConfig ipc call TEST_ALIVE || ~/.config/hypr/hyprland/scripts/zoom.sh decrease 0.1
binde = Super, code:86, exec, qs -c $qsConfig ipc call TEST_ALIVE || ~/.config/hypr/hyprland/scripts/zoom.sh increase 0.1


