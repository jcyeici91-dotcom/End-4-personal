# Ventana de Renderizado
windowrule = match:title ^(Render.*)$, float on
windowrule = match:title ^(Render.*)$, size 950 700
windowrule = match:title ^(Render.*)$, center on

# Ventana de Configuración
windowrule = match:title ^(Configure.*)$, float on
windowrule = match:title ^(Configure.*)$, size 1000 750
windowrule = match:title ^(Configure.*)$, center on
