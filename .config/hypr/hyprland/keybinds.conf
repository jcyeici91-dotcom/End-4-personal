# 6) INTEGRACIÓN QUICKSHELL (Interfaz gráfica del sistema)
# =============================================================================
# -- Interrupts para “soltar Super” y no dejar cosas colgadas --
binditn = Super, catchall, global, quickshell:searchToggleReleaseInterrupt
bind = Ctrl, Super_L, global, quickshell:searchToggleReleaseInterrupt
bind = Ctrl, Super_R, global, quickshell:searchToggleReleaseInterrupt
bind = Super, mouse:272, global, quickshell:searchToggleReleaseInterrupt
bind = Super, mouse:273, global, quickshell:searchToggleReleaseInterrupt
bind = Super, mouse:274, global, quickshell:searchToggleReleaseInterrupt
bind = Super, mouse:275, global, quickshell:searchToggleReleaseInterrupt
bind = Super, mouse:276, global, quickshell:searchToggleReleaseInterrupt
bind = Super, mouse:277, global, quickshell:searchToggleReleaseInterrupt
bind = Super, mouse_up,  global, quickshell:searchToggleReleaseInterrupt
bind = Super, mouse_down,global, quickshell:searchToggleReleaseInterrupt
bindit = ,Super_L, global, quickshell:workspaceNumber
bindit = ,Super_R, global, quickshell:workspaceNumber

# -- Overview / Paneles --
bind = Super, Space, global, quickshell:overviewWorkspacesToggle # Toggle overview

# -- Clipboard --
bindd = Super, V, Clipboard history >> clipboard, global, quickshell:overviewClipboardToggle # Clipboard history >> clipboard
# Fallback clipboard history if needed:
bindd = Super, V, Copy clipboard history entry, exec, qs -c $qsConfig ipc call TEST_ALIVE || pkill fuzzel || cliphist list | fuzzel --match-mode fzf --dmenu | cliphist decode | wl-copy # [hidden] Clipboard history >> clipboard (fallback)

# -- Emoji --
bindd = Super, Period, Emoji >> clipboard, global, quickshell:overviewEmojiToggle # Emoji >> clipboard
# Fallback emoji:
bindd = Super, Period, Copy an emoji, exec, qs -c $qsConfig ipc call TEST_ALIVE || pkill fuzzel || ~/.config/hypr/hyprland/scripts/fuzzel-emoji.sh copy # [hidden] Emoji >> clipboard (fallback)

# --- NUEVOS AGREGADOS DEL ORIGINAL (Que te faltaban) ---
bindd = Super, Slash, Toggle cheatsheet, global, quickshell:cheatsheetToggle # Toggle cheatsheet
bindd = Super, K, Toggle on-screen keyboard, global, quickshell:oskToggle # Toggle on-screen keyboard
bindd = Super, J, Toggle bar, global, quickshell:barToggle # Toggle bar
bindd = Ctrl+Alt, Delete, Toggle session menu, global, quickshell:sessionToggle # Toggle session menu
bind = Shift+Super+Alt, Slash, exec, qs -p ~/.config/quickshell/$qsConfig/welcome.qml # [hidden] Launch welcome app
bind = Ctrl+Super, R, exec, killall ags agsv1 gjs ydotool qs quickshell; qs -c $qsConfig & # Restart widgets
bind = Ctrl+Super, P, global, quickshell:panelFamilyCycle # Cycle panel family

bind = Super, G, global, quickshell:overlayToggle # Toggle overlay

bindd = Super+Ctrl, L, Toggle session menu, global, quickshell:sessionToggle # Toggle session menu

# bindd = Super, J, Toggle bar, global, quickshell:barToggle # (Duplicado arriba, pero original aquí)

bind = Ctrl+Alt, Delete, exec, qs -c $qsConfig ipc call TEST_ALIVE || pkill wlogout || wlogout -p layer-shell # [hidden] Session menu (fallback)

bindd = Super, R, Toggle wallpaper selector, global, quickshell:wallpaperSelectorToggle # Wallpaper selector

bindd = Ctrl+Super+Alt, T, Select random wallpaper, global, quickshell:wallpaperSelectorRandom # Random wallpaper
bindd = Ctrl+Super, T, Change wallpaper, exec, qs -c $qsConfig ipc call TEST_ALIVE || ~/.config/quickshell/$qsConfig/scripts/colors/switchwall.sh # [hidden] Change wallpaper (fallback)

bind = Super+Alt, W, global, quickshell:panelFamilyCycle # Cycle panel family

# =============================================================================
# 7) TEMAS ESPECÍFICOS (Noctalia / Caelestia / Dank)
# =============================================================================
# ¡ATENCIÓN!: Hyprland usará la configuración que lea al final si hay repetidas.

################ Core Noctalia binds ######################################
# --------------------- JC -----------------------------------------------
bind = SUPER, SPACE, exec, qs -c noctalia ipc call launcher toggle
bind = SUPER, R, exec, qs -c noctalia ipc call wallpaper toggle
bind = SUPER+CONTROL, L, exec, qs -c noctalia ipc call sessionMenu toggle
bind = CONTROL+ALT, E, exec, qs -c noctalia ipc call launcher emoji
#bind = SUPER, S, exec, qs -c noctalia ipc call controlCenter toggle
bind = SUPER, comma, exec, qs -c noctalia ipc call settings toggle

# Audio Controls
bindel = , XF86AudioRaiseVolume, exec, qs -c noctalia ipc call volume increase
bindel = , XF86AudioLowerVolume, exec, qs -c noctalia ipc call volume decrease
bindl = , XF86AudioMute, exec, qs -c noctalia ipc call volume muteOutput

# Brightness Controls
bindel = , XF86MonBrightnessUp, exec, qs -c noctalia ipc call brightness increase
bindel = , XF86MonBrightnessDown, exec, qs -c noctalia ipc call brightness decrease

# Utility shortcuts
bind = SUPER, V, exec, qs -c noctalia ipc call launcher clipboard
bind = SUPER, C, exec, qs -c noctalia ipc call launcher calculator
bind = SUPER, L, exec, qs -c noctalia ipc call lockScreen lock

################ Core Caelestia binds ####################################
# --------------------- JC ----------------------------------------------
# bind = Super, L, exec, hyprctl dispatch global quickshell:lock
bind = Super, Tab, exec, qs ipc -c overview call overview toggle
bind = Super, space, global, caelestia:launcher
bindin = Super, catchall, global, caelestia:launcherInterrupt
bindin = Super, mouse:272, global, caelestia:launcherInterrupt
bindin = Super, mouse:273, global, caelestia:launcherInterrupt
bindin = Super, mouse:274, global, caelestia:launcherInterrupt
bindin = Super, mouse:275, global, caelestia:launcherInterrupt
bindin = Super, mouse:276, global, caelestia:launcherInterrupt
bindin = Super, mouse:277, global, caelestia:launcherInterrupt
bindin = Super, mouse_up, global, caelestia:launcherInterrupt
bindin = Super, mouse_down, global, caelestia:launcherInterrupt

# Utilities Caelestia
bindl = , Print, exec, caelestia screenshot  # Full screen capture > clipboard
bind = Super+Shift, S, global, caelestia:screenshotFreeze  # Capture region (freeze)
bind = Super+Shift+Alt, S, global, caelestia:screenshot  # Capture region
bind = Super+Alt, R, exec, caelestia record -s  # Record screen with sound
bind = Ctrl+Alt, R, exec, caelestia record  # Record screen
bind = Super+Shift+Alt, R, exec, caelestia record -r  # Record region
bind = Super+Shift, C, exec, hyprpicker -a  # Colour picker

# Volume Caelestia
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = Super+Shift, M, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindle = , XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ $volumeStep%+
bindle = , XF86AudioLowerVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume @DEFAULT_AUDIO_SINK@ $volumeStep%-

# Media Caelestia
bindl = Ctrl+Super, Space, global, caelestia:mediaToggle
bindl = , XF86AudioPlay, global, caelestia:mediaToggle
bindl = , XF86AudioPause, global, caelestia:mediaToggle
bindl = Ctrl+Super, Equal, global, caelestia:mediaNext
bindl = , XF86AudioNext, global, caelestia:mediaNext
bindl = Ctrl+Super, Minus, global, caelestia:mediaPrev
bindl = , XF86AudioPrev, global, caelestia:mediaPrev
bindl = , XF86AudioStop, global, caelestia:mediaStop
bind = SUPER, R, exec, ~/.config/hypr/pick-wallpaper.sh

####################### FIN ##############################

# --- GRUPOS (Estilo Pestañas) ---
# Agrupa la ventana actual con la siguiente (crea una pila)
bind = Super, A, togglegroup

# NOTA: En el original, Super+A es Toggle Sidebar Left. Como prefieres GRUPOS, se mantiene el tuyo.
# Si quisieras la barra lateral del original, descomenta la siguiente línea:
# bind = Super, A, global, quickshell:sidebarLeftToggle

################ Core DANK binds ####################################
# --------------------- JC ----------------------------------------------
$mod = SUPER
# Application Launchers
bind = $mod, space, exec, dms ipc call spotlight toggle
bind = $mod, V, exec, dms ipc call clipboard toggle
bind = $mod, M, exec, dms ipc call processlist focusOrToggle
bind = $mod, comma, exec, dms ipc call settings focusOrToggle
bind = $mod, N, exec, dms ipc call notifications toggle
bind = $mod, R, exec, dms ipc call dankdash wallpaper

# Audio Controls
bindel = , XF86AudioRaiseVolume, exec, dms ipc call audio increment 3
bindel = , XF86AudioLowerVolume, exec, dms ipc call audio decrement 3
bindl = , XF86AudioMute, exec, dms ipc call audio mute
bind = Alt, space, exec, dms ipc call mpris playPause

# Brightness Controls
bindel = , XF86MonBrightnessUp, exec, dms ipc call brightness increment 5
bindel = , XF86MonBrightnessDown, exec, dms ipc call brightness decrement 5
bind = $mod+Ctrl, L, exec, dms ipc call powermenu toggle

bind=Super+Alt, P, exec, qswitch --panel
bind = Super, M, exec, ~/.config/hypr/scripts/toggle_layout.sh && ~/.local/bin/qs-layout


# Foco en el stack / cambiar foco
bind = ALT, H, movefocus, l
bind = ALT, L, movefocus, r
bind = ALT, K, movefocus, u

bind = ALT, J, movefocus, d
# Intercambiar ventanas (swap)
bind = ALT SHIFT, H, movewindow, l
bind = ALT SHIFT, L, movewindow, r
bind = ALT SHIFT, K, movewindow, u
bind = ALT SHIFT, J, movewindow, d

# Cambiar tamaño master (mfact) en vivo
bind = ALT, minus, layoutmsg, mfact -0.05
bind = ALT, equal, layoutmsg, mfact +0.05

# Rotar orientación del master (izq/der/arriba/abajo)
bind = ALT, R, layoutmsg, orientationnext

# Mandar ventana a master
bind = ALT, Return, layoutmsg, swapwithmaster


