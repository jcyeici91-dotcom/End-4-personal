# =============================================================================
# DICCIONARIO RÁPIDO DE TECLAS (para las “raras”)
# =============================================================================
# MODIFICADORES:
#   Super / Super_L  = Tecla Windows (izquierda).
#   Super_R          = Tecla Windows (derecha).
#   Alt              = Tecla Alt.
#   Ctrl             = Tecla Control.
#   Shift            = Tecla Mayús.
#
# TECLAS DE SÍMBOLOS (según el dibujo del teclado):
#   Equal            = =  (y +)
#   Minus            = -  (y _)
#   Slash            = /  (y ?)
#   Backslash        = \  (y |)
#   BracketLeft      = [  (y {)
#   BracketRight     = ]  (y })
#   Semicolon        = ;  (a veces Ñ según layout)
#   Apostrophe       = '  (y ")
#   Period           = .  (y >)
#   Comma            = ,  (y <)
#   Return           = Enter
#   Space            = Barra espaciadora
#
# TECLAS “ESPECIALES / MULTIMEDIA”:
#   Print                 = Impr Pant (captura)
#   XF86AudioRaiseVolume  = Subir volumen (tecla multimedia)
#   XF86AudioLowerVolume  = Bajar volumen
#   XF86AudioMute         = Silenciar salida
#   XF86AudioMicMute      = Silenciar micrófono
#   XF86AudioPlay/Pause/Next/Prev/Stop = controles multimedia
#   XF86MonBrightnessUp/Down = brillo
#
# RATÓN (mouse:xxx):
#   mouse:272 = clic izquierdo
#   mouse:273 = clic derecho
#   mouse:274 = clic medio (rueda / botón central)  (depende del ratón)
#   mouse:275/276/277 = botones extra (laterales) si tu ratón los tiene
#   mouse_up / mouse_down = rueda arriba / rueda abajo
#
# CÓDIGOS (code:NN):
# - Son keycodes del teclado. Útil si el nombre de tecla no coincide con tu layout.
# - En tu config:
#   code:10..19  ≈ números 1..0 (fila superior, depende de layout)
#   code:79..90  ≈ teclado numérico (keypad), depende de layout
#
# TIPOS DE BIND (los que usas):
#   bind    = normal (al presionar)
#   binde   = “repetible” al mantener (ej. splitratio/zoom)
#   bindl   = “locked” (funciona incluso en lock / o en capas especiales, según setup)
#   bindle  = locked + repetible (típico para volumen/brillo)
#   bindm   = binds con ratón (drag/resize)
#   bindd   = bind “descriptivo” (incluye texto de ayuda/cheatsheet)
#   bindld  = variante “locked + descriptivo” (según tu setup)
#   bindid  = bind por ID (especial para el manejo consistente de Super)
#   bindit  = bind “interrupt/typed” (usado por quickshell workspaceNumber)
#   binditn = bind interrupt (catchall) (quickshell)
#   bindin  = bind interrupt (caelestia)
#
# =============================================================================
# 0) 🛑 REQUISITO TÉCNICO (DEBEN IR ARRIBA PARA SUPER / QUICKSHELL)
# =============================================================================
#! Shell (Estos deben ir arriba para funcionar consistentemente con la tecla Super)
#bindid = Super, Super_L, Toggle search, global, quickshell:searchToggleRelease # Toggle search
bindid = Super, Super_R, Toggle search, global, quickshell:searchToggleRelease # [hidden] Toggle search
bind = Super, Super_L, exec, qs -c $qsConfig ipc call TEST_ALIVE || pkill fuzzel || fuzzel # [hidden] Launcher (fallback)
bind = Super, Super_R, exec, qs -c $qsConfig ipc call TEST_ALIVE || pkill fuzzel || fuzzel # [hidden] Launcher (fallback)

# =============================================================================
# 1) GESTIÓN DE VENTANAS (Window Management)
# =============================================================================
# -- Foco y Movimiento --
bind = Super, Left, movefocus, l                # Foco a la ventana de la Izquierda
bind = Super, Right, movefocus, r               # Foco a la ventana de la Derecha
bind = Super, Up, movefocus, u                  # Foco a la ventana de Arriba
bind = Super, Down, movefocus, d                # Foco a la ventana de Abajo
bind = Super, BracketLeft, movefocus, l         # [hidden] (Alternativo con corchete)
bind = Super, BracketRight, movefocus, r        # [hidden] (Alternativo con corchete)

bind = Super+Shift, Left, movewindow, l         # Mover la ventana actual a la Izquierda
bind = Super+Shift, Right, movewindow, r        # Mover la ventana actual a la Derecha
bind = Super+Shift, Up, movewindow, u           # Mover la ventana actual Arriba
bind = Super+Shift, Down, movewindow, d         # Mover la ventana actual Abajo

# -- Mouse (arrastrar / redimensionar) --
bindm = Super, mouse:272, movewindow            # Mantener Super + Clic Izquierdo para arrastrar ventana
bindm = Super, mouse:274, movewindow            # [hidden]
bindm = Super, mouse:273, resizewindow          # Mantener Super + Clic Derecho para cambiar tamaño

# -- Acciones de Ventana --
bind = Super, Q, killactive,                    # Cerrar ventana activa (La "X")
#bind = Alt, F4, killactive,                     # [hidden] Cerrar estilo Windows
bind = Super+Shift+Alt, Q, exec, hyprctl kill  # Forzar cierre (Si una app se congela, usa esto y hazle clic)
bind = Super, D, fullscreen, 1                  # Maximizar (Mantiene la barra superior visible)
bind = Super, F, fullscreen, 0                  # Pantalla Completa (Oculta todo, como en juegos)
bind = Super+Alt, F, fullscreenstate, 0 3       # [hidden] Engañar a la app para que crea que está full
bind = Super, P, pin                            # Pin (La ventana se queda pegada aunque cambies de escritorio)
bind = Super+Alt, Space, togglefloating,        # Cambiar entre modo Flotante y Mosaico

# -- Tamaño y División --
binde = Super, Semicolon, splitratio, -0.1      # Hacer la ventana más pequeña (con la tecla punto y coma)
binde = Super, Apostrophe, splitratio, +0.1     # Hacer la ventana más grande (con la tecla comilla)
bind = Ctrl+Super, Backslash, resizeactive, exact 640 480 # [hidden] Poner ventana en tamaño 640x480

# =============================================================================
# 2) ESPACIOS DE TRABAJO (Workspaces)
# =============================================================================
# -- Navegación Básica --
bind = Ctrl+Super, Right, workspace, r+1        # Ir al escritorio de la derecha
bind = Ctrl+Super, Left, workspace, r-1         # Ir al escritorio de la izquierda
bind = Super, mouse_up, workspace, +1           # Rueda del ratón arriba: escritorio siguiente
bind = Super, mouse_down, workspace, -1         # Rueda del ratón abajo: escritorio anterior
bind = Ctrl+Super, mouse_up, workspace, r+1     # [hidden]
bind = Ctrl+Super, mouse_down, workspace, r-1   # [hidden]
bind = Super, Page_Down, workspace, +1          # [hidden]
bind = Super, Page_Up, workspace, -1            # [hidden]
bind = Ctrl+Super, Page_Down, workspace, r+1    # [hidden]
bind = Ctrl+Super, Page_Up, workspace, r-1      # [hidden]
bind = Ctrl+Super+Alt, Right, workspace, m+1    # [hidden]
bind = Ctrl+Super+Alt, Left, workspace, m-1     # [hidden]

# -- Mover Ventanas entre Workspaces --
bind = Super+Shift, mouse_down, movetoworkspace, r-1 # Mover ventana al escritorio anterior (con rueda)
bind = Super+Shift, mouse_up, movetoworkspace, r+1    # Mover ventana al escritorio siguiente (con rueda)
bind = Super+Alt, mouse_down, movetoworkspace, -1     # [hidden]
bind = Super+Alt, mouse_up, movetoworkspace, +1       # [hidden]
bind = Super+Alt, Page_Down, movetoworkspace, +1      # [hidden]
bind = Super+Alt, Page_Up, movetoworkspace, -1        # [hidden]
bind = Super+Shift, Page_Down, movetoworkspace, r+1   # [hidden]
bind = Super+Shift, Page_Up, movetoworkspace, r-1     # [hidden]
bind = Ctrl+Super+Shift, Right, movetoworkspace, r+1 # [hidden]
bind = Ctrl+Super+Shift, Left, movetoworkspace, r-1   # [hidden]

# -- Scratchpad (Espacio Especial) --
bind = Super, S, togglespecialworkspace,        # Mostrar/Ocultar el espacio especial
bind = Super+Alt, S, movetoworkspacesilent, special # Enviar ventana actual al espacio especial (sin cambiarte tú)
bind = Super, mouse:275, togglespecialworkspace, # [hidden]
bind = Ctrl+Super, S, togglespecialworkspace,     # [hidden]
bind = Ctrl+Super, BracketLeft, workspace, -1     # [hidden]
bind = Ctrl+Super, BracketRight, workspace, +1    # [hidden]
bind = Ctrl+Super, Up, workspace, r-5             # [hidden]
bind = Ctrl+Super, Down, workspace, r+5           # [hidden]

# -- Cambio Directo (Teclas 1-10 con scripts) --
# Nota: Usa scripts personalizados. Presiona Super + Número
bind = Super, code:10, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 1
bind = Super, code:11, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 2
bind = Super, code:12, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 3
bind = Super, code:13, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 4
bind = Super, code:14, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 5
bind = Super, code:15, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 6
bind = Super, code:16, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 7
bind = Super, code:17, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 8
bind = Super, code:18, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 9
bind = Super, code:19, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 10

# Keypad (Teclado numérico) - Cambio
bindp = Super, code:87, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 1
bindp = Super, code:88, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 2
bindp = Super, code:89, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 3
bindp = Super, code:83, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 4
bindp = Super, code:84, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 5
bindp = Super, code:85, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 6
bindp = Super, code:79, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 7
bindp = Super, code:80, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 8
bindp = Super, code:81, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 9
bindp = Super, code:90, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 10

# -- Mover Ventana a Workspace Directo --
# Presiona Super + Alt + Número
bind = Super+Alt, code:10, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 1
bind = Super+Alt, code:11, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 2
bind = Super+Alt, code:12, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 3
bind = Super+Alt, code:13, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 4
bind = Super+Alt, code:14, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 5
bind = Super+Alt, code:15, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 6
bind = Super+Alt, code:16, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 7
bind = Super+Alt, code:17, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 8
bind = Super+Alt, code:18, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 9
bind = Super+Alt, code:19, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 10

# Keypad (Teclado numérico) - Mover
bind = Super+Alt, code:87, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 1
bind = Super+Alt, code:88, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 2
bind = Super+Alt, code:89, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 3
bind = Super+Alt, code:83, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 4
bind = Super+Alt, code:84, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 5
bind = Super+Alt, code:85, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 6
bind = Super+Alt, code:79, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 7
bind = Super+Alt, code:80, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 8
bind = Super+Alt, code:81, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 9
bind = Super+Alt, code:90, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 10

# =============================================================================
# 3) APLICACIONES Y LANZADORES (Apps & Launchers)
# =============================================================================
# -- Aplicaciones Comunes --
bind = Super, T, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh  "${TERMINAL}" "kitty -1" "foot" "alacritty" "wezterm" "konsole" "kgx" "uxterm" "xterm" # Terminal (Alt)
bind = Ctrl+Alt, T, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "${TERMINAL}" "kitty -1" "foot" "alacritty" "wezterm" "konsole" "kgx" "uxterm" "xterm" # [hidden] (terminal) (for Ubuntu people)

bind = Super, E, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "dolphin" "nautilus" "nemo" "thunar" "${TERMINAL}" "kitty -1 fish -c yazi" # Gestor de Archivos

bind = Super, W, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "google-chrome-stable" "zen-browser" "firefox" "brave" "chromium" "microsoft-edge-stable" "opera" "librewolf" # Navegador Web

bind = Super, C, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "code" "codium" "cursor" "zed" "zedit" "zeditor" "kate" "gnome-text-editor" "emacs" "command -v nvim && kitty -1 nvim" "command -v micro && kitty -1 micro" # Code editor
bind = Super, X, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "kate" "gnome-text-editor" "emacs" # Text editor
bind = Ctrl+Super+Shift+Alt, W, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "wps" "onlyoffice-desktopeditors" "libreoffice" # Office software
bind = Super, I, exec, XDG_CURRENT_DESKTOP=gnome ~/.config/hypr/hyprland/scripts/launch_first_available.sh "qs -p ~/.config/quickshell/$qsConfig/settings.qml" "systemsettings" "gnome-control-center" "better-control" # Settings app
bind = Ctrl+Shift, Escape, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "gnome-system-monitor" "plasma-systemmonitor --page-name Processes" "command -v btop && kitty -1 fish -c btop" # Task manager

#bind = Ctrl+Super, V, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "pavucontrol-qt" "pavucontrol" # Mezclador de Volumen

# -- TUS ATAJOS PERSONALIZADOS (Flatpaks y más) --
bind = Super+ALT, Y, exec, flatpak run com.github.th_ch.youtube_music  # YouTube Music (Super + Alt + Y)
bind = Super+ALT, T, exec, flatpak run org.telegram.desktop            # Telegram (Super + Alt + T)
bind = Super+ALT, E, exec, gedit                                       # Gedit (Super + Alt + E)
# Discord (D)
bind = SUPER ALT, d, exec, discord
# OBS Studio (O)
bind = SUPER ALT, o, exec, obs
# Usar 'timeshift-launcher'
bind = SUPER ALT, b, exec, timeshift-launcher

# --- Multimedia ---
# VLC Media Player (V)
bind = SUPER ALT, v, exec, vlc

# -- Utilidades de Sistema (Session) --
bindd = Super, L, Lock, exec, loginctl lock-session                    # Bloquear Pantalla (Super + L)
bindld = Super+Shift, L, Suspend system, exec, systemctl suspend || loginctl suspend # Suspender (Super + Shift + L)
bindd = Ctrl+Shift+Alt+Super, Delete, Shutdown, exec, systemctl poweroff || loginctl poweroff # [hidden] Power off

# -- Máquinas Virtuales (Submap) --
bind = Super+Alt, F1, exec, notify-send 'Entered Virtual Machine submap' 'Keybinds disabled. Hit Super+Alt+F1 to escape' -a 'Hyprland' && hyprctl dispatch submap virtual-machine
submap = virtual-machine
bind = Super+Alt, F1, exec, notify-send 'Exited Virtual Machine submap' 'Keybinds re-enabled' -a 'Hyprland' && hyprctl dispatch submap global
submap = global

bind = Super, B, exec, flatpak run com.brave.Browser

# =============================================================================
# 4) MULTIMEDIA Y HARDWARE (Audio, Brillo, Play/Pause)
# =============================================================================
# -- Audio (Botones dedicados) --
bindle=, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+ -l 1.5   # Subir Volumen
bindle=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-          # Bajar Volumen
bindl = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_SINK@ toggle                      # Silenciar Audio
bindld = Super+Shift,M, Toggle mute, exec, wpctl set-mute @DEFAULT_SINK@ toggle         # [hidden]
bindl = Alt ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle                # Silenciar Micrófono
bindl = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle                 # Silenciar Micrófono (tecla dedicada)
bindld = Super+Alt,M, Toggle mic, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle          # [hidden]

# -- Brillo (Botones dedicados) --
bindle=, XF86MonBrightnessUp, exec, qs -c $qsConfig ipc call brightness increment || brightnessctl s 5%+ # Subir Brillo
bindle=, XF86MonBrightnessDown, exec, qs -c $qsConfig ipc call brightness decrement || brightnessctl s 5%- # Bajar Brillo

# -- Control de Reproducción (Playerctl) --
bindl= Super+Shift, P, exec, playerctl play-pause  # Play/Pause (Super+Shift+P)
bindl= Super+Shift, N, exec, playerctl next || playerctl position `bc <<< "100 * $(playerctl metadata mpris:length) / 1000000 / 100"` # Siguiente
bindl= Super+Shift, B, exec, playerctl previous    # Anterior
bindl= ,XF86AudioPlay, exec, playerctl play-pause  # [hidden]
bindl= ,XF86AudioPause, exec, playerctl play-pause # [hidden]
bindl= ,XF86AudioNext, exec, playerctl next || playerctl position `bc <<< "100 * $(playerctl metadata mpris:length) / 1000000 / 100"` # [hidden]
bindl= ,XF86AudioPrev, exec, playerctl previous    # [hidden]
bind = Super+Shift+Alt, mouse:275, exec, playerctl previous # [hidden]
bind = Super+Shift+Alt, mouse:276, exec, playerctl next || playerctl position `bc <<< "100 * $(playerctl metadata mpris:length) / 1000000 / 100"` # [hidden]

# =============================================================================
# 5) HERRAMIENTAS (Capturas, Zoom, OCR, IA)
# =============================================================================
# -- Captura de Pantalla (Screenshot) --
bindl = ,Print,exec,grim - | wl-copy  # Tecla "Impr Pant" -> Pantalla completa al portapapeles
bindln = Ctrl,Print, exec, mkdir -p $(xdg-user-dir PICTURES)/Screenshots && grim $(xdg-user-dir PICTURES)/Screenshots/Screenshot_"$(date '+%Y-%m-%d_%H.%M.%S')".png # Pantalla completa a archivo
bindln = Ctrl,Print,exec,grim - | wl-copy # [hidden]
bind = Super+Shift, S, global, quickshell:regionScreenshot # Recorte de pantalla (Quickshell)
bind = Super+Shift, S, exec, qs -c $qsConfig ipc call TEST_ALIVE || pidof slurp || hyprshot --freeze --clipboard-only --mode region --silent # Recorte (Fallback)

# -- Grabación de Pantalla (Recording) --
bindl = Super+Shift, R, global, quickshell:regionRecord # Grabar región (sin audio)
bindl = Super+Shift, R, exec, qs -c $qsConfig ipc call TEST_ALIVE || ~/.config/quickshell/$qsConfig/scripts/videos/record.sh # Fallback
bindl = Super+Alt, R, global, quickshell:regionRecord # [hidden]
bindl = Super+Alt, R, exec, qs -c $qsConfig ipc call TEST_ALIVE || ~/.config/quickshell/$qsConfig/scripts/videos/record.sh # Fallback
bindl = Ctrl+Alt, R, exec, ~/.config/quickshell/$qsConfig/scripts/videos/record.sh --fullscreen # Grabar pantalla completa
bindl = Super+Shift+Alt, R, exec, ~/.config/quickshell/$qsConfig/scripts/videos/record.sh --fullscreen --sound # Grabar pantalla con sonido

# -- OCR (Copiar texto de imagen) --
bind = Super+Shift, X, global, quickshell:regionOcr # OCR al portapapeles
bind = Super+Shift, T, global, quickshell:regionOcr # [hidden]
# Fallback OCR:
bind = Super+Shift, X,exec, qs -c $qsConfig ipc call TEST_ALIVE || pidof slurp || grim -g "$(slurp $SLURP_ARGS)" "/tmp/ocr_image.png" && tesseract "/tmp/ocr_image.png" stdout -l $(tesseract --list-langs | awk 'NR>1{print $1}' | tr '\\n' '+' | sed 's/\\+$/\\n/') | wl-copy && rm "/tmp/ocr_image.png"
bind = Super+Shift, T,exec, qs -c $qsConfig ipc call TEST_ALIVE || pidof slurp || grim -g "$(slurp $SLURP_ARGS)" "/tmp/ocr_image.png" && tesseract "/tmp/ocr_image.png" stdout -l $(tesseract --list-langs | awk 'NR>1{print $1}' | tr '\\n' '+' | sed 's/\\+$/\\n/') | wl-copy && rm "/tmp/ocr_image.png"

bindd = Super+Shift, C, Color picker, exec, hyprpicker -a # Selector de Color (Hex)

# -- Google Lens Search (Buscar imagen en Google) --
bind = Super+Shift, A, global, quickshell:regionSearch
bind = Super+Shift, A, exec, qs -c $qsConfig ipc call TEST_ALIVE || pidof slurp || ~/.config/hypr/hyprland/scripts/snip_to_search.sh # Fallback

# -- AI (Nuevo del Original) --
bindd = Super+Shift+Alt, mouse:273, Generate AI summary for selected text, exec, ~/.config/hypr/hyprland/scripts/ai/primary-buffer-query.sh # [hidden] AI summary for selected text

# -- Zoom (Accessibilidad / Lupa) --
binde = Super, Minus, exec, qs -c $qsConfig ipc call zoom zoomOut # Zoom Menos (Super + Menos)
binde = Super, Equal, exec, qs -c $qsConfig ipc call zoom zoomIn  # Zoom Más (Super + Igual)
binde = Super, Minus, exec, qs -c $qsConfig ipc call TEST_ALIVE || ~/.config/hypr/hyprland/scripts/zoom.sh decrease 0.1 # Fallback
binde = Super, Equal, exec, qs -c $qsConfig ipc call TEST_ALIVE || ~/.config/hypr/hyprland/scripts/zoom.sh increase 0.1 # Fallback
# Zoom con Keypad
binde = Super, code:82, exec, qs -c $qsConfig ipc call zoom zoomOut
binde = Super, code:86, exec, qs -c $qsConfig ipc call zoom zoomIn
binde = Super, code:82, exec, qs -c $qsConfig ipc call TEST_ALIVE || ~/.config/hypr/hyprland/scripts/zoom.sh decrease 0.1
binde = Super, code:86, exec, qs -c $qsConfig ipc call TEST_ALIVE || ~/.config/hypr/hyprland/scripts/zoom.sh increase 0.1

