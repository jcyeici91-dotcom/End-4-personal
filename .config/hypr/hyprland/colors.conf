general {
    col.active_border = rgba(958e9977)
    col.inactive_border = rgba(4a454e55)
}

misc {
    background_color = rgba(151218FF)
}

plugin {
    hyprbars {
        bar_text_font = Google Sans Flex Medium, Rubik, Geist, AR One Sans, Reddit Sans, Inter, Roboto, Ubuntu, Noto Sans, sans-serif
        bar_height = 30
        bar_padding = 10
        bar_button_padding = 5
        bar_precedence_over_border = true
        bar_part_of_window = true

        bar_color = rgba(ffffff18)
        col.text = rgba(f7f8fbff)

        bar_blur = true
        bar_blur_size = 6
        bar_blur_passes = 2
        bar_blur_ignore_opacity = true

    hyprbars-button = rgb(F7DCDE), 18, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(F7DCDE), 18, 󰖯, hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(F7DCDE), 18, 󰖰, hyprctl dispatch movetoworkspacesilent special 
        hyprbars-button = rgb(F7DCDE), 18, ,kitty
        hyprbars-button = rgb(F7DCDE), 18, , gedit 
        hyprbars-button = rgb(F7DCDE), 18, , firefox
    }
}



windowrule = border_color rgba(d7bafbAA) rgba(d7bafb77), match:pin 1
